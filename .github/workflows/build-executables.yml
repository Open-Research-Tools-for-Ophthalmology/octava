# See https://github.com/actions/checkout
# See https://github.com/actions/setup-python
# See https://github.com/actions/upload-artifact

name: Build executables to Windows/MacOS/Linux

on:
    push:
        branches:
            - main

jobs:
    build:
        # See https://github.com/actions/runner-images for available runners
        #! No runner for windows and linux arm64 and paid runner for macos for x64
        #! https://docs.github.com/en/actions/concepts/runners/github-hosted-runners#overview-of-github-hosted-runners
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Windows x64
                    - os: windows-latest
                      architecture: x64
                      artifact_name: windows-x64-binary
                    # Linux x64
                    - os: ubuntu-latest
                      architecture: x64
                      artifact_name: linux-x64-binary
                    # macOS x64
                    # - os: macos-26-large
                    #   architecture: x64
                    #   artifact_name: macos-x64-binary
                    # macOS arm
                    - os: macos-26
                      architecture: arm64
                      artifact_name: macos-arm64-binary

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            # Windows uses python directly from python.org
            # Linux/Darwin See https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.10"
                  architecture: ${{ matrix.architecture }}

            - name: Install Python dependencies
              run: |
                  pip install -r requirements.txt
              working-directory: ./

            - name: Install PyInstaller
              run: |
                  pip install pyinstaller
              working-directory: ./

            - name: Build executable
              # Don't spawn terminal for production
              # Bundle all runtimes and assets folder
              #! --hidden-import to resolve missing import issues on Linux, see https://stackoverflow.com/questions/46680429/importerror-no-module-named-tkinter-finder
              run: |
                  pyinstaller --noconsole --onefile --add-data "./code/assets:assets" --hidden-import='PIL._tkinter_finder' ./code/gui.py
              working-directory: ./

            - name: Upload Artifact
              uses: actions/upload-artifact@v6
              with:
                  name: ${{ matrix.artifact_name }}
                  path: dist/

            - name: List files in dist folder
              run: ls -R ./dist/
