# See https://github.com/actions/checkout
# See https://github.com/actions/setup-python
# See https://github.com/actions/upload-artifact

name: Create Releases with Windows/MacOS/Linux builds

on:
  push:
    # TODO change to main after done testing
    branches:
      - proofreading

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'ubuntu-latest', 'macos-latest']

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.10.19

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
      working-directory: ./

    - name: Install PyInstaller
      run: |
        pip install pyinstaller
      working-directory: ./

    - name: Build executable
      # Don't spawn terminal for production
      # Bundle all runtimes inside
      run: |
        pyinstaller --noconsole --onefile ./gui/build/gui.py
      working-directory: ./

    - name: Create Artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v6
      with:
        name: windows-binary
        path: dist/

    - name: Create Artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v6
      with:
        name: linux-binary
        path: dist/

    - name: Create Artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v6
      with:
        name: macos-binary
        path: dist/

    - name: List files in dist folder
      run: ls -R ./dist/